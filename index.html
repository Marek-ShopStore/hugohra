<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash - Na Steroidech!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        canvas { display: block; touch-action: none; }

        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #score-display {
            position: fixed;
            top: 15px; right: 15px;
            color: #fff;
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 900;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #08f;
            z-index: 20;
            letter-spacing: 2px;
        }

        #attempt-display {
            position: fixed;
            top: 15px; left: 15px;
            color: #fff;
            font-size: clamp(13px, 2.5vw, 18px);
            font-weight: 700;
            text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
            z-index: 20;
        }

        #coin-display {
            position: fixed;
            top: 45px; right: 15px;
            color: #ffd700;
            font-size: clamp(14px, 3vw, 22px);
            font-weight: 900;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8800;
            z-index: 20;
            letter-spacing: 1px;
        }

        #progress-bar-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 20;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0ff, #f0f, #ff0);
            box-shadow: 0 0 10px #0ff, 0 0 20px #f0f;
            transition: width 0.1s linear;
        }

        #start-screen, #death-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: all;
        }

        #start-screen {
            background: radial-gradient(ellipse at center, rgba(0,20,40,0.95) 0%, rgba(0,0,0,0.98) 100%);
        }

        #start-screen h1 {
            font-size: clamp(36px, 10vw, 72px);
            font-weight: 900;
            background: linear-gradient(135deg, #0ff, #f0f, #ff0, #0f0);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
            text-shadow: none;
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        #start-screen .subtitle {
            font-size: clamp(14px, 3vw, 22px);
            color: #888;
            margin-bottom: clamp(20px, 5vw, 50px);
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        #start-screen .controls-info {
            font-size: clamp(11px, 2.5vw, 16px);
            color: #666;
            margin-bottom: clamp(15px, 3vw, 30px);
            padding: 0 15px;
            text-align: center;
        }

        .start-btn {
            padding: clamp(12px, 2.5vw, 18px) clamp(30px, 8vw, 60px);
            font-size: clamp(16px, 3.5vw, 24px);
            font-weight: 800;
            border: 2px solid #0ff;
            background: transparent;
            color: #0ff;
            cursor: pointer;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff, 0 0 60px #0ff;
            transform: scale(1.05);
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #0ff, #f0f, #ff0, #0ff);
            background-size: 400% 400%;
            z-index: -1;
            animation: gradientShift 3s ease infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .start-btn:hover::before { opacity: 1; }

        #death-screen {
            background: radial-gradient(ellipse at center, rgba(40,0,0,0.95) 0%, rgba(0,0,0,0.98) 100%);
            display: none;
        }

        #death-screen h2 {
            font-size: clamp(32px, 8vw, 56px);
            color: #f33;
            font-weight: 900;
            text-shadow: 0 0 20px #f00, 0 0 40px #f00;
            margin-bottom: 20px;
            animation: shake 0.5s ease;
        }

        #death-screen .death-score {
            font-size: clamp(18px, 4vw, 28px);
            color: #fff;
            margin-bottom: 10px;
        }

        #death-screen .death-percent {
            font-size: clamp(14px, 3vw, 20px);
            color: #888;
            margin-bottom: clamp(20px, 5vw, 40px);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .flash-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s;
        }

        .flash-active {
            opacity: 0.8;
        }
    </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  GEOMETRY DASH NA STEROIDECH - Three.js
// ============================================================

// --- GLOBALS ---
let scene, camera, renderer, composer;
let player, playerGroup;
let obstacles = [];
let decorations = [];
let particles = [];
let trailParticles = [];
let groundTiles = [];
let bgStars = [];
let shockwaves = [];

let gameRunning = false;
let gameStarted = false;
let isDead = false;
let speed = 0.12;
let baseSpeed = 0.12;
let score = 0;
let bestScore = 0;
let attempts = 1;
let distance = 0;
let totalLevelLength = 900;
let jumpVelocity = 0;
let isGrounded = true;
let gravity = -0.012;
let jumpForce = 0.24;
let playerY = 0.6;
let rotation = 0;
let groundY = 0;
let jumpPressed = false;

// Rocket mode
let isRocketMode = false;
let rocketMesh = null;
let portals = [];
const ROCKET_GRAVITY = -0.008;
const ROCKET_THRUST = 0.014;
const ROCKET_MAX_VY = 0.18;
const ROCKET_MIN_VY = -0.18;
const ROCKET_CEILING = 6.5;
const ROCKET_FLOOR = 0.8;
let cameraShake = 0;
let beatPulse = 0;
let colorPhase = 0;
let obstacleTimer = 0;
let difficultyRamp = 0;
let comboCount = 0;
let lastObstaclePassed = -999;
let lastTime = 0;
const TARGET_FPS = 60;
const IS_MOBILE = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (('ontouchstart' in window) && window.innerWidth < 1024);

// Level data
let levelData = [];
let levelIndex = 0;
let coins = [];
let collectedCoins = 0;
const TOTAL_COINS = 5;

const PLAYER_SIZE = 0.55;
const GROUND_LEVEL = 0.6;

// --- MUSIC ---
let audioCtx = null;
let musicPlaying = false;
let musicGain = null;
let musicInterval = null;

function initMusic() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.35;
    musicGain.connect(audioCtx.destination);
}

function playNote(freq, duration, time, type, gainVal) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(gainVal || 0.15, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + duration);
    osc.connect(g);
    g.connect(musicGain);
    osc.start(time);
    osc.stop(time + duration);
}

function playKick(time) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);
    g.gain.setValueAtTime(0.5, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
    osc.connect(g);
    g.connect(musicGain);
    osc.start(time);
    osc.stop(time + 0.2);
}

function playHihat(time) {
    if (!audioCtx) return;
    const bufSize = audioCtx.sampleRate * 0.05;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.08, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 8000;
    src.connect(hp);
    hp.connect(g);
    g.connect(musicGain);
    src.start(time);
}

function startMusic() {
    initMusic();
    if (musicPlaying) return;
    musicPlaying = true;

    // Energetic EDM/dubstep pattern
    const bpm = 140;
    const beatLen = 60 / bpm;

    // Bass notes - driving bassline (minor key, E minor)
    const bassNotes = [82.41, 98.0, 110.0, 82.41, 73.42, 82.41, 98.0, 110.0]; // E2, G2, A2, E2, D2, E2, G2, A2
    // Lead melody
    const melodyNotes = [329.6, 392.0, 440.0, 392.0, 329.6, 293.7, 329.6, 440.0,
                         523.3, 440.0, 392.0, 329.6, 392.0, 440.0, 523.3, 587.3];

    let barIndex = 0;
    function scheduleBar() {
        if (!musicPlaying || !audioCtx) return;
        const now = audioCtx.currentTime + 0.05;

        for (let beat = 0; beat < 8; beat++) {
            const t = now + beat * beatLen;

            // Kick on every beat
            playKick(t);

            // Hi-hat on off-beats
            playHihat(t + beatLen * 0.5);
            if (beat % 2 === 1) playHihat(t + beatLen * 0.25);

            // Bass - square wave
            const bassNote = bassNotes[beat % bassNotes.length];
            playNote(bassNote, beatLen * 0.8, t, 'sawtooth', 0.12);

            // Melody - plays every other beat with variation
            if (beat % 2 === 0) {
                const melIdx = ((barIndex * 4) + (beat / 2)) % melodyNotes.length;
                playNote(melodyNotes[melIdx], beatLen * 0.6, t, 'square', 0.08);
                // Harmony
                playNote(melodyNotes[melIdx] * 1.25, beatLen * 0.4, t + beatLen * 0.1, 'triangle', 0.04);
            }

            // Arp on some beats for texture
            if (beat % 4 === 2) {
                const arpFreqs = [523.3, 659.3, 784.0, 659.3];
                for (let a = 0; a < 4; a++) {
                    playNote(arpFreqs[a], beatLen * 0.15, t + a * beatLen * 0.25, 'sine', 0.05);
                }
            }
        }

        barIndex++;
        musicInterval = setTimeout(scheduleBar, beatLen * 8 * 1000 - 50);
    }

    scheduleBar();
}

function stopMusic() {
    musicPlaying = false;
    if (musicInterval) {
        clearTimeout(musicInterval);
        musicInterval = null;
    }
}

// --- INIT ---
function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000011, 0.012);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 3, 8);
    camera.lookAt(0, 1, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.5 : 2));
    renderer.shadowMap.enabled = !IS_MOBILE;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const pointLight1 = new THREE.PointLight(0x00ffff, 2, 30);
    pointLight1.position.set(0, 5, 0);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0xff00ff, 1.5, 30);
    pointLight2.position.set(5, 3, -5);
    scene.add(pointLight2);

    // Player
    createPlayer();

    // Ground
    createGround();

    // Background stars
    createStars();

    // Generate level
    generateLevel();

    // Detect touch device
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    // Show appropriate controls info
    const controlsInfo = document.getElementById('controls-info');
    if (isTouchDevice) {
        controlsInfo.textContent = 'DOTKNI SE = Skok | Portál = Raketka (drž = leť nahoru)';
    } else {
        controlsInfo.textContent = 'MEZERNÍK / KLIK = Skok | Portál = Raketka (drž = leť)';
    }

    // Events
    window.addEventListener('resize', onResize);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);

    // Mouse events (for desktop)
    window.addEventListener('mousedown', (e) => {
        if (e.target.closest('.start-btn')) return;
        jumpPressed = true;
    });
    window.addEventListener('mouseup', () => { jumpPressed = false; });

    // Touch events (for mobile/tablet)
    window.addEventListener('touchstart', (e) => {
        if (e.target.closest('.start-btn')) return;
        e.preventDefault();
        jumpPressed = true;
    }, { passive: false });
    window.addEventListener('touchend', (e) => {
        if (e.target.closest('.start-btn')) return;
        e.preventDefault();
        jumpPressed = false;
    }, { passive: false });

    // Prevent double-tap zoom and other mobile gestures
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('gestureend', (e) => e.preventDefault());

    // Buttons - use both click and touchend for reliability
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', restartGame);
    startBtn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); startGame(); });
    retryBtn.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); restartGame(); });

    animate();
}

// --- PLAYER ---
function createPlayer() {
    playerGroup = new THREE.Group();

    // Main cube with emissive neon material
    const geo = new THREE.BoxGeometry(PLAYER_SIZE, PLAYER_SIZE, PLAYER_SIZE);
    const mat = new THREE.MeshStandardMaterial({
        color: 0x00ffff,
        emissive: 0x00aaff,
        emissiveIntensity: 0.6,
        metalness: 0.8,
        roughness: 0.2,
    });
    player = new THREE.Mesh(geo, mat);
    player.castShadow = true;
    playerGroup.add(player);

    // Inner glow cube
    const innerGeo = new THREE.BoxGeometry(PLAYER_SIZE * 0.7, PLAYER_SIZE * 0.7, PLAYER_SIZE * 0.7);
    const innerMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.3,
    });
    const innerCube = new THREE.Mesh(innerGeo, innerMat);
    playerGroup.add(innerCube);

    // Wireframe outline
    const wireGeo = new THREE.BoxGeometry(PLAYER_SIZE * 1.05, PLAYER_SIZE * 1.05, PLAYER_SIZE * 1.05);
    const wireMat = new THREE.MeshBasicMaterial({
        color: 0x00ffff,
        wireframe: true,
        transparent: true,
        opacity: 0.5,
    });
    const wireCube = new THREE.Mesh(wireGeo, wireMat);
    playerGroup.add(wireCube);

    // Point light on player
    const playerLight = new THREE.PointLight(0x00ffff, 2, 8);
    playerLight.position.set(0, 0, 0);
    playerGroup.add(playerLight);

    // Rocket mesh (hidden by default)
    const rocketGroup = new THREE.Group();
    // Body
    const rBodyGeo = new THREE.BoxGeometry(0.7, 0.35, 0.35);
    const rBodyMat = new THREE.MeshStandardMaterial({
        color: 0xff8800, emissive: 0xff4400, emissiveIntensity: 0.8,
        metalness: 0.8, roughness: 0.2
    });
    const rBody = new THREE.Mesh(rBodyGeo, rBodyMat);
    rocketGroup.add(rBody);
    // Nose cone
    const rNoseGeo = new THREE.ConeGeometry(0.2, 0.35, 4);
    const rNoseMat = new THREE.MeshStandardMaterial({
        color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 0.6,
        metalness: 0.7, roughness: 0.3
    });
    const rNose = new THREE.Mesh(rNoseGeo, rNoseMat);
    rNose.rotation.z = -Math.PI / 2;
    rNose.position.x = 0.5;
    rocketGroup.add(rNose);
    // Top fin
    const finGeo = new THREE.BoxGeometry(0.3, 0.2, 0.05);
    const finMat = new THREE.MeshStandardMaterial({
        color: 0xff0044, emissive: 0xff0022, emissiveIntensity: 0.6
    });
    const topFin = new THREE.Mesh(finGeo, finMat);
    topFin.position.set(-0.25, 0.25, 0);
    rocketGroup.add(topFin);
    // Bottom fin
    const bottomFin = new THREE.Mesh(finGeo, finMat.clone());
    bottomFin.position.set(-0.25, -0.25, 0);
    rocketGroup.add(bottomFin);
    // Engine glow
    const engineGeo = new THREE.SphereGeometry(0.12, 8, 6);
    const engineMat = new THREE.MeshBasicMaterial({
        color: 0xff4400, transparent: true, opacity: 0.8,
        blending: THREE.AdditiveBlending
    });
    const engine = new THREE.Mesh(engineGeo, engineMat);
    engine.position.x = -0.4;
    rocketGroup.add(engine);

    rocketGroup.visible = false;
    rocketMesh = rocketGroup;
    playerGroup.add(rocketGroup);

    playerGroup.position.set(0, GROUND_LEVEL, 0);
    scene.add(playerGroup);
}

// --- GROUND ---
function createGround() {
    // Main ground plane
    const groundGeo = new THREE.PlaneGeometry(400, 8);
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x111122,
        metalness: 0.9,
        roughness: 0.3,
        emissive: 0x050510,
        emissiveIntensity: 0.3,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.position.z = 190;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid lines on ground
    for (let i = -20; i < 400; i += 2) {
        const lineGeo = new THREE.PlaneGeometry(0.02, 8);
        const lineMat = new THREE.MeshBasicMaterial({
            color: 0x0044ff,
            transparent: true,
            opacity: 0.2,
        });
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(i, 0.01, 0);
        scene.add(line);
        groundTiles.push(line);
    }

    // Side glow strips
    for (let side of [-3.5, 3.5]) {
        const stripGeo = new THREE.PlaneGeometry(400, 0.1);
        const stripMat = new THREE.MeshBasicMaterial({
            color: 0xff00ff,
            transparent: true,
            opacity: 0.6,
        });
        const strip = new THREE.Mesh(stripGeo, stripMat);
        strip.rotation.x = -Math.PI / 2;
        strip.position.set(190, 0.02, side);
        scene.add(strip);
    }
}

// --- STARS ---
function createStars() {
    const starsGeo = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const sizes = [];

    const starCount = IS_MOBILE ? 800 : 2000;
    for (let i = 0; i < starCount; i++) {
        positions.push(
            (Math.random() - 0.5) * 200,
            Math.random() * 60 + 5,
            (Math.random() - 0.5) * 100 - 20
        );

        const c = new THREE.Color();
        c.setHSL(Math.random(), 0.8, 0.7);
        colors.push(c.r, c.g, c.b);
        sizes.push(Math.random() * 2 + 0.5);
    }

    starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    starsGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const starsMat = new THREE.PointsMaterial({
        size: 0.15,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
    });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);
    bgStars.push(starField);
}

// --- JUMP PHYSICS CALCULATOR ---
// Simulate the jump arc to know exactly how high/far the player can go
function calcJumpArc(spd) {
    // Returns { maxHeight, totalFrames, jumpDistance, heightAtDist(d) }
    const frames = [];
    let vy = jumpForce;
    let y = 0; // relative to ground
    let x = 0;
    let frame = 0;
    while (y >= 0 || frame === 0) {
        frames.push({ x, y });
        vy += gravity;
        y += vy;
        x += spd;
        frame++;
        if (frame > 200) break; // safety
    }
    const maxHeight = Math.max(...frames.map(f => f.y));
    const jumpDistance = x;
    // Get height at a given horizontal distance from jump start
    function heightAtDist(d) {
        for (let i = 0; i < frames.length - 1; i++) {
            if (frames[i].x <= d && frames[i + 1].x > d) {
                const t = (d - frames[i].x) / (frames[i + 1].x - frames[i].x);
                return frames[i].y + t * (frames[i + 1].y - frames[i].y);
            }
        }
        return 0;
    }
    return { maxHeight, totalFrames: frame, jumpDistance, heightAtDist, frames };
}

// Check if an obstacle group is clearable with a single jump
function canClearGroup(groupObstacles, spd) {
    const arc = calcJumpArc(spd);
    // Filter out platforms - they're safe
    const dangerousObs = groupObstacles.filter(o => o.type !== 'platform');
    if (dangerousObs.length === 0) return true;
    // Find the total horizontal span the player must clear
    let minX = Infinity, maxX = -Infinity;
    for (const obs of dangerousObs) {
        const halfW = 0.4;
        minX = Math.min(minX, obs.x - halfW);
        maxX = Math.max(maxX, obs.x + halfW);
    }
    const clearWidth = maxX - minX;

    // Player can jump early - find best jump point
    // Try jumping 0.5-2.0 units before the first obstacle
    for (let jumpOffset = 0.3; jumpOffset < 2.5; jumpOffset += 0.2) {
        const jumpX = minX - jumpOffset;
        let clears = true;
        for (const obs of dangerousObs) {
            const dist = obs.x - jumpX;
            const playerH = arc.heightAtDist(dist);
            let requiredH;
            requiredH = (obs.spikeHeight || 1.0) * 0.6; // spike effective height from ground
            if (playerH < requiredH) {
                clears = false;
                break;
            }
        }
        // Also check that player lands after the last obstacle
        const landDist = maxX + 0.3 - jumpX;
        if (clears && landDist < arc.jumpDistance) {
            return true;
        }
    }
    return false;
}

// --- LEVEL GENERATION ---
function generateLevel() {
    levelData = [];
    let pos = 15;

    // Calculate jump capabilities at different speeds
    const arcSlow = calcJumpArc(baseSpeed);
    const arcFast = calcJumpArc(baseSpeed + 0.04);
    // Max jumpable obstacle height (with margin)
    const maxJumpableHeight = arcSlow.maxHeight + GROUND_LEVEL - 0.3;
    // Max clearable horizontal span
    const maxClearSpan = arcSlow.jumpDistance * 0.7; // 70% of max for safety

    while (pos < totalLevelLength) {
        const difficulty = Math.min(pos / totalLevelLength, 1);
        const currentSpeed = baseSpeed + difficulty * 0.04;
        const r = Math.random();

        // Big generous gaps - plenty of time to react
        // 5 units at start, shrinking to 3.5 at max difficulty
        const minReactGap = 5.0 - difficulty * 1.5;

        let groupObstacles = [];

        // Spike height varies with difficulty
        const spikeH = () => {
            const base = 1.0;
            const extra = difficulty * 1.0 * Math.random();
            return base + extra; // 1.0 to 2.0
        };

        // Only spikes (some tall) and connected platforms with spikes underneath
        if (difficulty < 0.2) {
            // Tutorial zone - single spikes
            groupObstacles = [{ type: 'spike', x: pos, y: 0, spikeHeight: 1.0 }];
        } else if (difficulty < 0.5) {
            // Easy zone
            if (r < 0.3) {
                groupObstacles = [{ type: 'spike', x: pos, y: 0, spikeHeight: spikeH() }];
            } else if (r < 0.5) {
                // Double spike, one taller
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: spikeH() },
                    { type: 'spike', x: pos + 1.2, y: 0, spikeHeight: spikeH() },
                ];
            } else {
                // Connected platform bridge with spikes underneath
                const steps = 2 + Math.floor(Math.random() * 2);
                const pw = 2.0 + Math.random() * 0.5;
                let py = 1.0 + Math.random() * 0.3;
                groupObstacles = [];
                for (let s = 0; s < steps; s++) {
                    const px = pos + s * (pw - 0.1); // overlap slightly for connection
                    groupObstacles.push({ type: 'platform', x: px, y: 0, width: pw, platformY: py });
                    groupObstacles.push({ type: 'spike', x: px, y: 0, spikeHeight: spikeH() });
                    py += 0.3 + Math.random() * 0.3; // gradually go up
                }
            }
        } else if (difficulty < 0.7) {
            // Medium zone
            if (r < 0.2) {
                const h = spikeH();
                groupObstacles = [{ type: 'spike', x: pos, y: 0, spikeHeight: h }];
            } else if (r < 0.35) {
                // Double spike, mixed heights
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: 1.0 },
                    { type: 'spike', x: pos + 1.0, y: 0, spikeHeight: 1.5 + Math.random() * 0.5 },
                ];
            } else if (r < 0.5) {
                // Triple spike with height variation
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: spikeH() },
                    { type: 'spike', x: pos + 1.0, y: 0, spikeHeight: 1.6 + Math.random() * 0.4 },
                    { type: 'spike', x: pos + 2.0, y: 0, spikeHeight: spikeH() },
                ];
            } else if (r < 0.75) {
                // Connected ascending platforms with spikes
                const steps = 3 + Math.floor(Math.random() * 2);
                const pw = 1.8 + Math.random() * 0.6;
                let py = 0.9 + Math.random() * 0.2;
                groupObstacles = [];
                for (let s = 0; s < steps; s++) {
                    const px = pos + s * (pw - 0.1);
                    groupObstacles.push({ type: 'platform', x: px, y: 0, width: pw, platformY: py });
                    if (s < steps - 1) {
                        groupObstacles.push({ type: 'spike', x: px, y: 0, spikeHeight: spikeH() });
                    }
                    py += 0.4 + Math.random() * 0.3;
                }
            } else {
                // Spike then connected platforms going up
                const pw = 2.0 + Math.random() * 0.5;
                let py = 1.1 + Math.random() * 0.3;
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: 1.3 + Math.random() * 0.5 },
                ];
                for (let s = 0; s < 2; s++) {
                    const px = pos + 2.0 + s * (pw - 0.1);
                    groupObstacles.push({ type: 'platform', x: px, y: 0, width: pw, platformY: py });
                    groupObstacles.push({ type: 'spike', x: px, y: 0, spikeHeight: spikeH() });
                    py += 0.5 + Math.random() * 0.3;
                }
            }
        } else {
            // Hard zone
            if (r < 0.15) {
                // Double tall spikes
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: 1.4 + Math.random() * 0.6 },
                    { type: 'spike', x: pos + 1.0, y: 0, spikeHeight: 1.4 + Math.random() * 0.6 },
                ];
            } else if (r < 0.3) {
                // Triple mixed height spikes
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: 1.0 },
                    { type: 'spike', x: pos + 0.9, y: 0, spikeHeight: 1.8 + Math.random() * 0.2 },
                    { type: 'spike', x: pos + 1.8, y: 0, spikeHeight: 1.2 },
                ];
            } else if (r < 0.45) {
                // Quad spikes with height variation
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: spikeH() },
                    { type: 'spike', x: pos + 0.85, y: 0, spikeHeight: 1.6 + Math.random() * 0.4 },
                    { type: 'spike', x: pos + 1.7, y: 0, spikeHeight: spikeH() },
                    { type: 'spike', x: pos + 2.55, y: 0, spikeHeight: 1.5 + Math.random() * 0.5 },
                ];
            } else if (r < 0.7) {
                // Long connected platform staircase going high into the air
                const steps = 3 + Math.floor(Math.random() * 3);
                const pw = 1.6 + Math.random() * 0.5;
                let py = 0.8 + Math.random() * 0.3;
                groupObstacles = [];
                for (let s = 0; s < steps; s++) {
                    const px = pos + s * (pw - 0.1);
                    groupObstacles.push({ type: 'platform', x: px, y: 0, width: pw, platformY: py });
                    groupObstacles.push({ type: 'spike', x: px, y: 0, spikeHeight: spikeH() });
                    py += 0.4 + Math.random() * 0.4; // goes higher and higher
                }
            } else {
                // Spike gauntlet into connected ascending platforms
                const pw = 1.8 + Math.random() * 0.6;
                let py = 1.2 + Math.random() * 0.3;
                groupObstacles = [
                    { type: 'spike', x: pos, y: 0, spikeHeight: 1.5 + Math.random() * 0.5 },
                    { type: 'spike', x: pos + 1.0, y: 0, spikeHeight: spikeH() },
                ];
                for (let s = 0; s < 3; s++) {
                    const px = pos + 2.5 + s * (pw - 0.1);
                    groupObstacles.push({ type: 'platform', x: px, y: 0, width: pw, platformY: py });
                    groupObstacles.push({ type: 'spike', x: px, y: 0, spikeHeight: spikeH() });
                    py += 0.5 + Math.random() * 0.3;
                }
            }
        }

        // Check if it's time for a rocket section (every ~200 units, starting at 100)
        const rocketSectionInterval = 200;
        const nextRocketAt = 100 + Math.floor((pos - 100) / rocketSectionInterval) * rocketSectionInterval;
        if (pos >= nextRocketAt && pos < nextRocketAt + 5 && difficulty > 0.1) {
            // Insert a rocket/flappy section
            const sectionLength = 40 + Math.floor(difficulty * 30);
            const portalX = pos + 3;
            levelData.push({ type: 'portal', x: portalX, toRocket: true, portalY: 2.5 });

            // Generate flappy bird pipes
            let pipeX = portalX + 8;
            const pipeEnd = portalX + sectionLength;
            while (pipeX < pipeEnd) {
                const gapSize = 3.5 - difficulty * 0.8; // Gap shrinks with difficulty (3.5 -> 2.7)
                const gapCenter = 2.0 + Math.random() * 3.0; // Gap center between 2.0 and 5.0
                const gapTop = gapCenter + gapSize / 2;

                // Bottom pipe
                const bottomH = gapCenter - gapSize / 2;
                if (bottomH > 0.3) {
                    levelData.push({ type: 'pipe', x: pipeX, isTop: false, gapTop: gapCenter, gapSize: gapSize, pipeHeight: bottomH });
                }

                // Top pipe
                const topH = ROCKET_CEILING + 1 - gapTop;
                if (topH > 0.3) {
                    levelData.push({ type: 'pipe', x: pipeX, isTop: true, gapTop: gapCenter, gapSize: gapSize, pipeHeight: topH });
                }

                pipeX += 15.0 + Math.random() * 6.0 - difficulty * 2.5; // Pipes get closer with difficulty
            }

            // End portal to switch back
            levelData.push({ type: 'portal', x: pipeEnd + 3, toRocket: false, portalY: 2.5 });

            pos = pipeEnd + 10;
            continue;
        }

        // Verify the group is clearable
        if (!canClearGroup(groupObstacles, currentSpeed)) {
            groupObstacles = [{ type: 'spike', x: pos, y: 0, spikeHeight: 1.0 }];
        }

        // Add obstacles to level
        for (const obs of groupObstacles) {
            levelData.push(obs);
        }

        // Calculate gap after this group
        let groupEnd = pos;
        for (const obs of groupObstacles) {
            const obsEnd = obs.x + (obs.width ? obs.width / 2 : 0.5);
            if (obsEnd > groupEnd) groupEnd = obsEnd;
        }
        // Generous gap for landing + reaction
        const gap = minReactGap + Math.random() * 2.0;
        pos = groupEnd + gap;

        // Decoration columns
        if (Math.random() < 0.3) {
            createDecoration(pos - 1.5, 'column');
        }
        if (Math.random() < 0.2) {
            createDecoration(pos - 0.8, 'ring');
        }
    }

    // Create 3D obstacles from level data
    for (const item of levelData) {
        createObstacle(item);
    }

    // Place 5 coins on the normal path, reachable with a jump
    const sectionLength = totalLevelLength / (TOTAL_COINS + 1);
    const coinY = 1.5 + PLAYER_SIZE / 2; // comfortable jump height

    for (let i = 0; i < TOTAL_COINS; i++) {
        const coinX = sectionLength * (i + 1);
        createCoin(coinX, coinY);
    }
}

function createCoin(x, y) {
    const coinGroup = new THREE.Group();
    const size = PLAYER_SIZE;

    // Solid bright yellow box - same size as player, always visible
    const geo = new THREE.BoxGeometry(size, size, size);
    const mat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        emissive: 0xffaa00,
        emissiveIntensity: 2.0,
        metalness: 0.8,
        roughness: 0.1,
    });
    const cube = new THREE.Mesh(geo, mat);
    coinGroup.add(cube);

    // Bright glow sphere around it
    const glowGeo = new THREE.SphereGeometry(size, 12, 8);
    const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffdd00,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    coinGroup.add(glow);

    coinGroup.position.set(x, y, 0);
    coinGroup.userData = { type: 'coin', collected: false };
    scene.add(coinGroup);
    coins.push(coinGroup);
}

// --- OBSTACLES ---
function createObstacle(data) {
    let mesh;
    const neonColors = [0xff0044, 0xff4400, 0xff0088, 0xcc0000, 0xff2200];
    const color = neonColors[Math.floor(Math.random() * neonColors.length)];

    if (data.type === 'spike') {
        const spikeH = data.spikeHeight || 1.0;
        const spikeR = 0.4 * (0.7 + spikeH * 0.3);
        const geo = new THREE.ConeGeometry(spikeR, spikeH, 4);
        const mat = new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.8,
            metalness: 0.7,
            roughness: 0.3,
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, spikeH / 2, 0);
        mesh.castShadow = true;

        // Glow ring at base
        const ringGeo = new THREE.RingGeometry(spikeR - 0.1, spikeR + 0.1, 16);
        const ringMat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(data.x, 0.05, 0);
        scene.add(ring);
        decorations.push(ring);

        mesh.userData = { type: 'spike', radius: spikeR * 0.85, height: spikeH };

    } else if (data.type === 'block') {
        const h = data.height || 1;
        const geo = new THREE.BoxGeometry(0.8, h, 0.8);
        const mat = new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.5,
            metalness: 0.8,
            roughness: 0.2,
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, h / 2, 0);
        mesh.castShadow = true;

        // Wireframe
        const wireGeo = new THREE.BoxGeometry(0.85, h + 0.05, 0.85);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.15 });
        const wire = new THREE.Mesh(wireGeo, wireMat);
        wire.position.copy(mesh.position);
        scene.add(wire);
        decorations.push(wire);

        mesh.userData = { type: 'block', width: 0.8, height: h };

    } else if (data.type === 'pillar') {
        const h = data.height || 3;
        const geo = new THREE.BoxGeometry(0.6, h, 0.6);
        const mat = new THREE.MeshStandardMaterial({
            color: 0x8800ff,
            emissive: 0x6600cc,
            emissiveIntensity: 0.7,
            metalness: 0.8,
            roughness: 0.2,
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, h / 2, 0);
        mesh.castShadow = true;

        // Top glow
        const topLight = new THREE.PointLight(0x8800ff, 1, 5);
        topLight.position.set(data.x, h + 0.5, 0);
        scene.add(topLight);
        decorations.push(topLight);

        mesh.userData = { type: 'pillar', width: 0.6, height: h };

    } else if (data.type === 'saw') {
        const geo = new THREE.TorusGeometry(0.7, 0.15, 8, 16);
        const mat = new THREE.MeshStandardMaterial({
            color: 0xff8800,
            emissive: 0xff4400,
            emissiveIntensity: 1.0,
            metalness: 0.9,
            roughness: 0.1,
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, data.y, 0);

        // Inner spokes
        for (let i = 0; i < 4; i++) {
            const spokeGeo = new THREE.BoxGeometry(1.2, 0.08, 0.08);
            const spokeMat = new THREE.MeshBasicMaterial({ color: 0xff4400 });
            const spoke = new THREE.Mesh(spokeGeo, spokeMat);
            spoke.rotation.z = (Math.PI / 4) * i;
            mesh.add(spoke);
        }

        mesh.userData = { type: 'saw', radius: 0.85, spinning: true };
    } else if (data.type === 'platform') {
        const w = data.width || 2.0;
        const h = data.height || 0.35;
        const platformY = data.platformY || 1.2;
        const geo = new THREE.BoxGeometry(w, h, 1.0);
        const greenColors = [0x00cc44, 0x00ee55, 0x22dd44, 0x00ff66, 0x11cc33];
        const gColor = greenColors[Math.floor(Math.random() * greenColors.length)];
        const mat = new THREE.MeshStandardMaterial({
            color: gColor,
            emissive: gColor,
            emissiveIntensity: 0.6,
            metalness: 0.5,
            roughness: 0.3,
        });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, platformY, 0);
        mesh.castShadow = true;

        // Top glow line
        const glowGeo = new THREE.BoxGeometry(w + 0.1, 0.05, 1.1);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x44ff88,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.set(data.x, platformY + h / 2 + 0.03, 0);
        scene.add(glow);
        decorations.push(glow);

        // Wireframe
        const wireGeo = new THREE.BoxGeometry(w + 0.05, h + 0.05, 1.05);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.12 });
        const wire = new THREE.Mesh(wireGeo, wireMat);
        wire.position.copy(mesh.position);
        scene.add(wire);
        decorations.push(wire);

        mesh.userData = { type: 'platform', width: w, height: h, platformY: platformY };
    } else if (data.type === 'portal') {
        // Portal - glowing ring that switches mode
        const portalGroup = new THREE.Group();
        const portalColor = data.toRocket ? 0xff8800 : 0x00ffff;

        // Outer ring
        const ringGeo = new THREE.TorusGeometry(1.2, 0.12, 16, 32);
        const ringMat = new THREE.MeshStandardMaterial({
            color: portalColor, emissive: portalColor, emissiveIntensity: 1.2,
            metalness: 0.9, roughness: 0.1
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.y = Math.PI / 2;
        portalGroup.add(ring);

        // Inner glow
        const innerGeo = new THREE.CircleGeometry(1.0, 32);
        const innerMat = new THREE.MeshBasicMaterial({
            color: portalColor, transparent: true, opacity: 0.3,
            side: THREE.DoubleSide, blending: THREE.AdditiveBlending
        });
        const inner = new THREE.Mesh(innerGeo, innerMat);
        inner.rotation.y = Math.PI / 2;
        portalGroup.add(inner);

        // Point light
        const pLight = new THREE.PointLight(portalColor, 3, 8);
        portalGroup.add(pLight);

        const portalY = data.portalY || 2.0;
        portalGroup.position.set(data.x, portalY, 0);
        portalGroup.userData = { type: 'portal', toRocket: data.toRocket, portalY: portalY };

        scene.add(portalGroup);
        portals.push(portalGroup);
        return; // Don't add to obstacles array

    } else if (data.type === 'pipe') {
        // Flappy bird style pipe (top or bottom)
        const pw = 1.0;
        const ph = data.pipeHeight || 3;
        const geo = new THREE.BoxGeometry(pw, ph, 1.2);
        const pipeMat = new THREE.MeshStandardMaterial({
            color: 0x00cc44, emissive: 0x008822, emissiveIntensity: 0.5,
            metalness: 0.6, roughness: 0.3
        });
        mesh = new THREE.Mesh(geo, pipeMat);
        const pipeY = data.isTop ? (ROCKET_CEILING + 0.5 - ph / 2 + (ROCKET_CEILING - data.gapTop)) : (ph / 2 - 0.1);
        mesh.position.set(data.x, data.isTop ? data.gapTop + data.gapSize / 2 + ph / 2 : data.gapTop - data.gapSize / 2 - ph / 2, 0);

        // Cap on the pipe end
        const capGeo = new THREE.BoxGeometry(pw + 0.3, 0.3, 1.4);
        const capMat = new THREE.MeshStandardMaterial({
            color: 0x00ee55, emissive: 0x00aa33, emissiveIntensity: 0.6,
            metalness: 0.5, roughness: 0.3
        });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.y = data.isTop ? -ph / 2 : ph / 2;
        mesh.add(cap);

        // Glow edge
        const glowGeo = new THREE.BoxGeometry(pw + 0.4, 0.08, 1.5);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x44ff88, transparent: true, opacity: 0.4,
            blending: THREE.AdditiveBlending
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        glow.position.y = data.isTop ? -ph / 2 - 0.15 : ph / 2 + 0.15;
        mesh.add(glow);

        mesh.userData = { type: 'pipe', width: pw, pipeHeight: ph, isTop: data.isTop, gapTop: data.gapTop, gapSize: data.gapSize };
    }

    if (mesh) {
        scene.add(mesh);
        obstacles.push(mesh);
    }
}

// --- DECORATIONS ---
function createDecoration(x, type) {
    if (type === 'column') {
        const h = 3 + Math.random() * 5;
        const side = Math.random() > 0.5 ? 3 : -3;
        const geo = new THREE.BoxGeometry(0.3, h, 0.3);
        const hue = Math.random();
        const color = new THREE.Color().setHSL(hue, 1, 0.5);
        const mat = new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.4,
            transparent: true,
            opacity: 0.6,
        });
        const col = new THREE.Mesh(geo, mat);
        col.position.set(x, h / 2, side);
        scene.add(col);
        decorations.push(col);
    } else if (type === 'ring') {
        const geo = new THREE.TorusGeometry(1.5, 0.05, 8, 32);
        const mat = new THREE.MeshBasicMaterial({
            color: 0x00ff88,
            transparent: true,
            opacity: 0.3,
        });
        const ring = new THREE.Mesh(geo, mat);
        ring.position.set(x, 2.5, 0);
        ring.rotation.y = Math.PI / 2;
        scene.add(ring);
        decorations.push(ring);
    }
}

// --- PARTICLES ---
function spawnTrailParticle() {
    const geo = new THREE.SphereGeometry(0.05 + Math.random() * 0.08, 4, 4);
    const hue = (colorPhase + Math.random() * 0.1) % 1;
    const color = new THREE.Color().setHSL(hue, 1, 0.6);
    const mat = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
    });
    const p = new THREE.Mesh(geo, mat);
    p.position.set(
        playerGroup.position.x + (Math.random() - 0.5) * 0.3,
        playerGroup.position.y + (Math.random() - 0.5) * 0.3,
        playerGroup.position.z + (Math.random() - 0.5) * 0.3
    );
    p.userData = {
        vx: (Math.random() - 0.5) * 0.02 - 0.05,
        vy: (Math.random() - 0.5) * 0.03,
        vz: (Math.random() - 0.5) * 0.04,
        life: 1.0,
        decay: 0.015 + Math.random() * 0.015,
    };
    scene.add(p);
    trailParticles.push(p);
}

function spawnExplosion(x, y, z, count, colorBase) {
    const actualCount = IS_MOBILE ? Math.floor(count * 0.4) : count;
    for (let i = 0; i < actualCount; i++) {
        const size = 0.05 + Math.random() * 0.2;
        let geo;
        const r = Math.random();
        if (r < 0.33) {
            geo = new THREE.BoxGeometry(size, size, size);
        } else if (r < 0.66) {
            geo = new THREE.TetrahedronGeometry(size);
        } else {
            geo = new THREE.SphereGeometry(size, 4, 4);
        }

        const hue = (colorBase + Math.random() * 0.15) % 1;
        const color = new THREE.Color().setHSL(hue, 1, 0.6);
        const mat = new THREE.MeshBasicMaterial({
            color: color,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
        });
        const p = new THREE.Mesh(geo, mat);
        p.position.set(x, y, z);

        const angle = Math.random() * Math.PI * 2;
        const upAngle = Math.random() * Math.PI - Math.PI * 0.3;
        const force = 0.05 + Math.random() * 0.2;

        p.userData = {
            vx: Math.cos(angle) * Math.cos(upAngle) * force,
            vy: Math.sin(upAngle) * force + 0.08,
            vz: Math.sin(angle) * Math.cos(upAngle) * force,
            life: 1.0,
            decay: 0.008 + Math.random() * 0.012,
            rotSpeed: (Math.random() - 0.5) * 0.3,
            gravity: -0.003,
        };
        scene.add(p);
        particles.push(p);
    }
}

function spawnShockwave(x, y, z) {
    const geo = new THREE.RingGeometry(0.1, 0.3, 32);
    const mat = new THREE.MeshBasicMaterial({
        color: 0xff4400,
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.position.set(x, y, z);
    ring.rotation.x = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    ring.userData = { life: 1.0, speed: 0.15 };
    scene.add(ring);
    shockwaves.push(ring);

    // Second ring - vertical
    const ring2 = ring.clone();
    ring2.material = mat.clone();
    ring2.rotation.x = (Math.random() - 0.5) * 0.5;
    ring2.rotation.y = Math.random() * Math.PI;
    ring2.userData = { life: 1.0, speed: 0.12 };
    scene.add(ring2);
    shockwaves.push(ring2);
}

function spawnJumpBurst() {
    for (let i = 0; i < 8; i++) {
        const geo = new THREE.SphereGeometry(0.04, 4, 4);
        const color = new THREE.Color().setHSL(0.5 + Math.random() * 0.1, 1, 0.7);
        const mat = new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 1,
            blending: THREE.AdditiveBlending,
        });
        const p = new THREE.Mesh(geo, mat);
        p.position.set(
            playerGroup.position.x,
            playerGroup.position.y - PLAYER_SIZE / 2,
            playerGroup.position.z
        );
        const angle = Math.random() * Math.PI * 2;
        p.userData = {
            vx: Math.cos(angle) * 0.05,
            vy: -0.02 - Math.random() * 0.03,
            vz: Math.sin(angle) * 0.05,
            life: 1.0,
            decay: 0.03,
        };
        scene.add(p);
        particles.push(p);
    }
}

// --- COLLISION ---
function checkCollision() {
    const px = playerGroup.position.x;
    const py = playerGroup.position.y;
    const halfSize = PLAYER_SIZE * 0.32; // Slightly forgiving hitbox

    for (const obs of obstacles) {
        const ox = obs.position.x;
        const oy = obs.position.y;
        const ud = obs.userData;

        if (Math.abs(px - ox) > 3) continue;

        if (ud.type === 'spike') {
            const sH = ud.height || 1.0;
            const sR = ud.radius || 0.35;
            const dx = px - ox;
            const dy = py - oy;
            // Cone collision: wider at base, narrow at top
            const heightFraction = Math.max(0, (sH/2 - dy) / sH);
            const effectiveRadius = sR * heightFraction;
            if (Math.abs(dx) < halfSize + effectiveRadius && dy < sH * 0.4 && dy > -sH * 0.5) {
                return true;
            }
        }
        // Platforms are NOT deadly - handled in physics

        if (ud.type === 'pipe') {
            const pw = (ud.width || 1.0) / 2;
            const ph = ud.pipeHeight || 3;
            const pipeTop = oy + ph / 2;
            const pipeBottom = oy - ph / 2;
            if (px + halfSize > ox - pw && px - halfSize < ox + pw) {
                if (py + halfSize > pipeBottom && py - halfSize < pipeTop) {
                    return true;
                }
            }
        }
    }
    return false;
}

// Check if player is landing on a platform (returns platform top Y or null)
function checkPlatformLanding() {
    const px = playerGroup.position.x;
    const py = playerY;
    const halfSize = PLAYER_SIZE / 2;

    for (const obs of obstacles) {
        const ud = obs.userData;
        if (ud.type !== 'platform') continue;

        const ox = obs.position.x;
        const w = (ud.width || 2.0) / 2;
        const h = ud.height || 0.35;
        const platTop = ud.platformY + h / 2;

        // Check horizontal overlap
        if (px + halfSize > ox - w + 0.05 && px - halfSize < ox + w - 0.05) {
            // Player is falling and feet are near platform top
            if (jumpVelocity <= 0 && py - halfSize <= platTop + 0.15 && py - halfSize >= platTop - 0.3) {
                return platTop + halfSize;
            }
        }
    }
    return null;
}

function checkPortalCollision() {
    const px = playerGroup.position.x;
    const py = playerY;
    for (const portal of portals) {
        if (portal.userData.passed) continue;
        const ox = portal.position.x;
        const oy = portal.userData.portalY;
        if (Math.abs(px - ox) < 1.0 && Math.abs(py - oy) < 2.0) {
            portal.userData.passed = true;
            const toRocket = portal.userData.toRocket;
            if (toRocket && !isRocketMode) {
                enterRocketMode();
            } else if (!toRocket && isRocketMode) {
                exitRocketMode();
            }
            // Flash effect
            spawnExplosion(ox, oy, 0, 30, toRocket ? 0.08 : 0.5);
        }
    }
}

function enterRocketMode() {
    isRocketMode = true;
    isGrounded = false;
    jumpVelocity = 0;
    // Position player up a bit if on ground
    // Start wave at middle height
    playerY = (ROCKET_CEILING + ROCKET_FLOOR) / 2;
    // Show rocket, hide cube
    player.visible = false;
    playerGroup.children[1].visible = false; // inner glow
    playerGroup.children[2].visible = false; // wireframe
    rocketMesh.visible = true;
    rotation = 0;
    player.rotation.z = 0;
}

function exitRocketMode() {
    isRocketMode = false;
    jumpVelocity = 0;
    // Show cube, hide rocket
    player.visible = true;
    playerGroup.children[1].visible = true;
    playerGroup.children[2].visible = true;
    rocketMesh.visible = false;
    // Land on ground if low enough
    if (playerY <= GROUND_LEVEL + 0.5) {
        playerY = GROUND_LEVEL;
        isGrounded = true;
    } else {
        isGrounded = false;
    }
    rotation = 0;
}

function checkCoinCollection() {
    const px = playerGroup.position.x;
    const py = playerGroup.position.y;
    const collectRadius = 0.9;

    for (const coin of coins) {
        if (coin.userData.collected) continue;
        const dx = px - coin.position.x;
        const dy = py - coin.position.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < collectRadius) {
            coin.userData.collected = true;
            coin.visible = false;
            collectedCoins++;
            document.getElementById('coin-display').textContent = `${collectedCoins} / ${TOTAL_COINS}`;

            // Collection effect - gold particles
            for (let i = 0; i < 15; i++) {
                const pGeo = new THREE.SphereGeometry(0.08, 4, 4);
                const pMat = new THREE.MeshBasicMaterial({
                    color: 0xffd700,
                    transparent: true,
                    opacity: 0.9,
                });
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.set(coin.position.x, coin.position.y, coin.position.z);
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: Math.random() * 0.15,
                    vz: (Math.random() - 0.5) * 0.15,
                    life: 1.0,
                    rotSpeed: Math.random() * 0.2,
                };
                scene.add(p);
                particles.push(p);
            }
        }
    }
}

// --- GAME LOGIC ---
function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('death-screen').style.display = 'none';
    gameRunning = true;
    gameStarted = true;
    isDead = false;
    distance = 0;
    startMusic();
    score = 0;
    playerY = GROUND_LEVEL;
    jumpVelocity = 0;
    isGrounded = true;
    rotation = 0;
    speed = baseSpeed;
    comboCount = 0;
    colorPhase = 0;
    lastTime = 0;

    isRocketMode = false;
    if (rocketMesh) rocketMesh.visible = false;
    player.visible = true;
    playerGroup.children[1].visible = true;
    playerGroup.children[2].visible = true;

    playerGroup.position.set(0, GROUND_LEVEL, 0);
    player.rotation.set(0, 0, 0);

    camera.position.set(0, 3, 8);
}

function restartGame() {
    // Clean up old level
    for (const obs of obstacles) {
        scene.remove(obs);
    }
    for (const dec of decorations) {
        scene.remove(dec);
    }
    for (const p of particles) {
        scene.remove(p);
    }
    for (const p of trailParticles) {
        scene.remove(p);
    }
    for (const s of shockwaves) {
        scene.remove(s);
    }
    for (const g of groundTiles) {
        scene.remove(g);
    }
    for (const c of coins) {
        scene.remove(c);
    }
    for (const p of portals) {
        scene.remove(p);
    }

    obstacles = [];
    decorations = [];
    particles = [];
    trailParticles = [];
    shockwaves = [];
    groundTiles = [];
    coins = [];
    portals = [];
    collectedCoins = 0;

    // Reset rocket mode
    isRocketMode = false;
    if (rocketMesh) rocketMesh.visible = false;
    player.visible = true;
    playerGroup.children[1].visible = true;
    playerGroup.children[2].visible = true;
    document.getElementById('coin-display').textContent = `0 / ${TOTAL_COINS}`;

    // Recreate
    createGround();
    generateLevel();

    attempts++;
    document.getElementById('attempt-display').textContent = `Pokus #${attempts}`;

    playerGroup.visible = true;
    startGame();
}

function die() {
    if (isDead) return;
    isDead = true;
    gameRunning = false;
    stopMusic();

    const px = playerGroup.position.x;
    const py = playerGroup.position.y;
    const pz = playerGroup.position.z;

    // Massive explosion
    spawnExplosion(px, py, pz, 80, 0.0);
    spawnExplosion(px, py, pz, 40, 0.55);
    spawnExplosion(px, py, pz, 30, 0.15);
    spawnShockwave(px, py, pz);
    spawnShockwave(px, py, pz);
    spawnShockwave(px, py + 0.5, pz);

    // Screen flash
    const flash = document.getElementById('flash-overlay');
    flash.classList.add('flash-active');
    setTimeout(() => flash.classList.remove('flash-active'), 100);

    cameraShake = 2.0;

    playerGroup.visible = false;

    // Calculate score
    const percent = Math.floor((distance / totalLevelLength) * 100);
    if (percent > bestScore) bestScore = percent;

    setTimeout(() => {
        document.getElementById('death-screen').style.display = 'flex';
        document.getElementById('death-score').textContent = `Skóre: ${percent}% | Coiny: ${collectedCoins}/${TOTAL_COINS}`;
        document.getElementById('death-best').textContent = `Nejlepší: ${bestScore}%`;
    }, 800);
}

// --- INPUT ---
function onKeyDown(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        jumpPressed = true;
    }
}

function onKeyUp(e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        jumpPressed = false;
    }
}

// --- UPDATE ---
function update(dt) {
    if (!dt) dt = 1;
    if (!gameStarted) {
        // Idle animation
        colorPhase += 0.003 * dt;
        const idleColor = new THREE.Color().setHSL(colorPhase % 1, 1, 0.5);
        player.material.color.copy(idleColor);
        player.material.emissive.copy(idleColor);
        playerGroup.rotation.y += 0.02 * dt;
        playerGroup.position.y = GROUND_LEVEL + Math.sin(Date.now() * 0.002) * 0.3;
        return;
    }

    if (!gameRunning) {
        // Update particles even when dead
        updateParticles(dt);
        updateShockwaves(dt);

        // Camera shake on death
        if (cameraShake > 0) {
            camera.position.x = playerGroup.position.x + (Math.random() - 0.5) * cameraShake;
            camera.position.y = 3 + (Math.random() - 0.5) * cameraShake;
            cameraShake *= Math.pow(0.92, dt);
            if (cameraShake < 0.01) cameraShake = 0;
        }
        return;
    }

    // --- MOVEMENT ---
    distance += speed * dt;
    const percent = Math.min(Math.floor((distance / totalLevelLength) * 100), 100);
    document.getElementById('score-display').textContent = `${percent}%`;
    document.getElementById('progress-bar').style.width = `${percent}%`;

    // Speed ramp
    speed = baseSpeed + (distance / totalLevelLength) * 0.03;

    // Color cycling
    colorPhase += 0.002 * dt;
    const playerColor = new THREE.Color().setHSL((colorPhase * 2) % 1, 1, 0.5);
    player.material.color.copy(playerColor);
    player.material.emissive.copy(playerColor);
    playerGroup.children[3].color.copy(playerColor); // point light

    // Check portal collisions
    checkPortalCollision();

    if (isRocketMode) {
        // --- FLAPPY BIRD MODE ---
        if (jumpPressed) {
            jumpVelocity += ROCKET_THRUST * dt;
        } else {
            jumpVelocity += ROCKET_GRAVITY * dt;
        }
        // Clamp velocity
        jumpVelocity = Math.max(ROCKET_MIN_VY, Math.min(ROCKET_MAX_VY, jumpVelocity));
        playerY += jumpVelocity * dt;

        // Ceiling and floor
        if (playerY >= ROCKET_CEILING) {
            playerY = ROCKET_CEILING;
            jumpVelocity = 0;
        }
        if (playerY <= ROCKET_FLOOR) {
            playerY = ROCKET_FLOOR;
            jumpVelocity = Math.max(jumpVelocity, 0);
        }

        playerGroup.position.y = playerY;

        // Rocket tilts based on velocity
        const targetTilt = jumpVelocity * 3.0;
        rotation += (targetTilt - rotation) * 0.15;
        rocketMesh.rotation.z = rotation;

        // Engine particles when thrusting
        if (jumpPressed && Math.random() < 0.7) {
            const geo = new THREE.SphereGeometry(0.06, 4, 4);
            const mat = new THREE.MeshBasicMaterial({
                color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00,
                transparent: true, opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const p = new THREE.Mesh(geo, mat);
            p.position.set(
                playerGroup.position.x - 0.5,
                playerGroup.position.y + (Math.random() - 0.5) * 0.2,
                (Math.random() - 0.5) * 0.3
            );
            p.userData = {
                vx: -0.08 - Math.random() * 0.05,
                vy: (Math.random() - 0.5) * 0.03,
                vz: (Math.random() - 0.5) * 0.03,
                life: 1.0, decay: 0.04 + Math.random() * 0.02
            };
            scene.add(p);
            particles.push(p);
        }
    } else {
        // --- NORMAL CUBE MODE ---
        // Jump
        if (jumpPressed && isGrounded) {
            jumpVelocity = jumpForce;
            isGrounded = false;
            spawnJumpBurst();
        }

        // Gravity
        if (!isGrounded) {
            jumpVelocity += gravity * dt;
            playerY += jumpVelocity * dt;

            // Block jumping through platform from below
            if (jumpVelocity > 0) {
                const halfSize = PLAYER_SIZE / 2;
                const px = playerGroup.position.x;
                for (const obs of obstacles) {
                    const ud = obs.userData;
                    if (ud.type !== 'platform') continue;
                    const ox = obs.position.x;
                    const w = (ud.width || 2.0) / 2;
                    const h = ud.height || 0.35;
                    const platBottom = ud.platformY - h / 2;
                    // Check horizontal overlap
                    if (px + halfSize > ox - w + 0.05 && px - halfSize < ox + w - 0.05) {
                        // Player head hitting platform bottom
                        if (playerY + halfSize >= platBottom && playerY + halfSize <= platBottom + 0.3) {
                            playerY = platBottom - halfSize;
                            jumpVelocity = 0;
                        }
                    }
                }
            }

            // Check platform landing
            const platformTop = checkPlatformLanding();
            if (platformTop !== null && jumpVelocity <= 0) {
                playerY = platformTop;
                jumpVelocity = 0;
                isGrounded = true;
                spawnJumpBurst();
            }

            if (playerY <= GROUND_LEVEL) {
                playerY = GROUND_LEVEL;
                jumpVelocity = 0;
                isGrounded = true;

                // Land effect
                spawnJumpBurst();
            }
        } else if (playerY > GROUND_LEVEL + 0.1) {
            // If standing on platform, check if still on it
            const platformTop = checkPlatformLanding();
            if (platformTop === null) {
                isGrounded = false;
            }
        }

        playerGroup.position.y = playerY;

        // Rotation - cube rotates forward only when in the air (small rotation)
        if (!isGrounded) {
            const rotAngle = 0.04 * dt; // gentle backward spin
            rotation += rotAngle;
        } else {
            // Snap to nearest 90° + slight rightward tilt when grounded
            const target = Math.round(rotation / (Math.PI / 2)) * (Math.PI / 2) - 0.15;
            rotation += (target - rotation) * 0.3;
        }
        player.rotation.z = rotation;
    }

    // Move world (obstacles come from right to left)
    const moveAmount = speed * dt;
    for (const obs of obstacles) {
        obs.position.x -= moveAmount;
    }
    for (const dec of decorations) {
        if (dec.position) dec.position.x -= moveAmount;
    }
    for (const g of groundTiles) {
        g.position.x -= moveAmount;
    }
    for (const portal of portals) {
        portal.position.x -= moveAmount;
        // Animate portal ring spinning
        portal.children[0].rotation.x += 0.03 * dt;
    }

    // Beat pulse effect
    beatPulse *= Math.pow(0.95, dt);
    const scaleFactor = 1 + beatPulse * 0.1;
    playerGroup.scale.set(scaleFactor, scaleFactor, scaleFactor);

    // Trail particles
    if (Math.random() < (IS_MOBILE ? 0.3 : 0.6)) {
        spawnTrailParticle();
    }

    // Collision check
    if (checkCollision()) {
        die();
        return;
    }

    // Coin collection
    checkCoinCollection();

    // Animate coins (slow spin + bob)
    for (const coin of coins) {
        if (coin.userData.collected) continue;
        coin.rotation.y += 0.02 * dt;
        coin.rotation.x += 0.01 * dt;
        coin.children[0].position.y = Math.sin(Date.now() * 0.003 + coin.position.x) * 0.15;
    }

    // Win condition
    if (distance >= totalLevelLength) {
        stopMusic();
        // Victory explosion!
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                spawnExplosion(
                    playerGroup.position.x + (Math.random() - 0.5) * 3,
                    playerGroup.position.y + Math.random() * 3,
                    playerGroup.position.z + (Math.random() - 0.5) * 3,
                    50, Math.random()
                );
            }, i * 200);
        }
        gameRunning = false;
        const percent2 = 100;
        if (percent2 > bestScore) bestScore = percent2;
        setTimeout(() => {
            document.getElementById('death-screen').style.display = 'flex';
            document.getElementById('death-screen').querySelector('h2').textContent = 'HOTOVO!';
            document.getElementById('death-screen').querySelector('h2').style.color = '#0f0';
            document.getElementById('death-screen').querySelector('h2').style.textShadow = '0 0 20px #0f0, 0 0 40px #0f0';
            document.getElementById('death-score').textContent = `Skóre: 100% | Coiny: ${collectedCoins}/${TOTAL_COINS}`;
            document.getElementById('death-best').textContent = `Nejlepší: ${bestScore}%`;
        }, 1200);
    }

    // Obstacles spinning
    for (const obs of obstacles) {
        if (obs.userData.spinning) {
            obs.rotation.z += 0.05 * dt;
        }
    }

    // Camera stays fixed on player (no drift)
    camera.position.x = playerGroup.position.x;
    const camTargetY = isRocketMode ? Math.max(3.5, playerY + 1.0) : 3;
    camera.position.y = camTargetY + Math.sin(Date.now() * 0.001) * 0.1 + beatPulse * 0.5;

    // Camera shake
    if (cameraShake > 0) {
        camera.position.x += (Math.random() - 0.5) * cameraShake;
        camera.position.y += (Math.random() - 0.5) * cameraShake * 0.5;
        cameraShake *= Math.pow(0.9, dt);
    }

    updateParticles(dt);
    updateShockwaves(dt);
}

function updateParticles(dt) {
    if (!dt) dt = 1;
    // Trail particles
    for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.position.x += p.userData.vx * dt;
        p.position.y += p.userData.vy * dt;
        p.position.z += p.userData.vz * dt;
        p.userData.life -= p.userData.decay * dt;
        p.material.opacity = p.userData.life * 0.8;
        p.scale.setScalar(p.userData.life);

        if (p.userData.life <= 0) {
            scene.remove(p);
            trailParticles.splice(i, 1);
        }
    }

    // Explosion particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx * dt;
        p.position.y += p.userData.vy * dt;
        p.position.z += p.userData.vz * dt;
        p.userData.vy += (p.userData.gravity || 0) * dt;
        p.userData.life -= p.userData.decay * dt;
        p.material.opacity = p.userData.life;

        if (p.userData.rotSpeed) {
            p.rotation.x += p.userData.rotSpeed * dt;
            p.rotation.z += p.userData.rotSpeed * 0.7 * dt;
        }

        const s = p.userData.life;
        p.scale.setScalar(s);

        if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
        }
    }
}

function updateShockwaves(dt) {
    if (!dt) dt = 1;
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.userData.life -= 0.02 * dt;
        const scale = 1 + (1 - sw.userData.life) * 15;
        sw.scale.set(scale, scale, scale);
        sw.material.opacity = sw.userData.life * 0.6;

        if (sw.userData.life <= 0) {
            scene.remove(sw);
            shockwaves.splice(i, 1);
        }
    }
}

// --- RESIZE ---
function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- ANIMATE ---
function animate(timestamp) {
    requestAnimationFrame(animate);

    if (!lastTime) lastTime = timestamp;
    const rawDt = (timestamp - lastTime) / (1000 / TARGET_FPS);
    lastTime = timestamp;
    // Clamp delta so big lag spikes don't cause huge jumps
    const dt = Math.min(rawDt, 3);

    update(dt);

    // Background color pulse
    const bgHue = (colorPhase * 0.5) % 1;
    const bgColor = new THREE.Color().setHSL(bgHue, 0.3, 0.02);
    scene.background = bgColor;
    scene.fog.color.copy(bgColor);

    renderer.render(scene, camera);
}

// --- START ---
init();
</script>
